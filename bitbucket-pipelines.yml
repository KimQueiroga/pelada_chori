image: ghcr.io/cirruslabs/flutter:3.29.3

pipelines:
  branches:
    develop:
      - step:
          name: Deploy Homologação
          caches:
            - flutter-cache
          script:
            - flutter pub get
            - flutter build web --release --dart-define=ENV=homol
            - apt-get update && apt-get install -y unzip curl
            - curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            - unzip awscliv2.zip
            - ./aws/install
            - aws s3 sync build/web s3://$S3_BUCKET_HOMOL --delete
            - aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_DIST_ID_HOMOL --paths "/*"

    main:
      - step:
          name: Deploy Produção
          caches:
            - flutter-cache
          script:
            - flutter pub get
            - flutter build web --release --dart-define=ENV=prod
            - apt-get update && apt-get install -y python3-pip
            - pip3 install awscli
            - aws s3 sync build/web s3://$S3_BUCKET_PROD --delete
            - aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_DIST_ID_PROD --paths "/*"

definitions:
  caches:
    flutter-cache: ~/.pub-cache
